name: vendor-agent-pack
# One-shot, idempotent: runs scripts/vendor_packs.py, which copies the vendored reference packs
# (202 wshobson/agents definitions, Superpowers skills, i-have-adhd, awesome-gpt-image-2 README)
# from each upstream's pinned commit byte for byte and checks every file against the sha256 in its
# manifest. A pack is written only if all its files match; any mismatch fails the job before commit.
# Runs only when this file changes on the PR branch. Remove this workflow after the packs landed.
on:
  push:
    branches: [yt-batch-spec-review]
    paths: ['.github/workflows/vendor-agent-pack.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstreams, verify hashes, copy bytes
        run: python scripts/vendor_packs.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/noesek/data
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -q -m "Vendor reference packs unchanged, verified against manifest hashes"
            git push
          fi
