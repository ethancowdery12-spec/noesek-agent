name: eval-gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  postgres-boot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: noesek
          POSTGRES_PASSWORD: noesek
          POSTGRES_DB: noesek
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U noesek" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[test,postgres]'
      - name: Fresh Postgres schema boot regression
        env:
          NOESEK_TEST_PG_URL: postgresql+asyncpg://noesek:noesek@localhost:5432/noesek
        run: python -m pytest tests/test_pg_boot.py -q
  tests-and-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[test]'
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Unit and integration tests
        run: python -m pytest tests -q
      - name: Injection suite
        run: python -m evals.injection_suite
      - name: Adapter evals
        run: python evals/run_adapters.py
