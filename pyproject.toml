[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "noesek-agent"
version = "3.2.2"
description = "Self-hostable WhatsApp-first hybrid AI agent runtime"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
# Exact pins, following the upstream supply-chain pinning policy (see THIRD_PARTY_NOTICES.md):
# no ranges; bump deliberately after review. Full transitive lock: requirements-lock.txt
dependencies = [
  "agent-client-protocol==0.9.0",
  "aiohttp==3.13.5",
  "aiosqlite==0.22.1",
  "certifi==2026.5.20",
  "concurrent-log-handler==0.9.29; sys_platform == 'win32'",
  "coverage==7.16.1",
  "croniter==6.2.4",
  "cryptography==50.0.0",
  "docker==7.1.0",
  "duckdb==1.4.3",
  "e2b==2.9.0",
  "fastapi==0.141.1",
  "fire==0.7.1",
  "markitdown[pdf,docx,pptx,xlsx]==0.1.7",
  "firecrawl-anydoc==0.2.4",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "Markdown==3.10.2",
  "mcp==2.2.0",
  "nemo-relay>=0.8.3,<0.9; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64' and 'android' not in platform_release) or (sys_platform == 'linux' and platform_machine == 'aarch64' and 'android' not in platform_release) or (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'win32' and platform_machine == 'ARM64')",
  "openai==2.24.0",
  "opentelemetry-sdk==1.44.0",
  "packaging==26.0",
  "pathspec==1.1.1",
  "Pillow==12.3.0",
  "pillow-heif>=1.4.0,<2",
  "playwright==1.56.0",
  "prompt_toolkit==3.0.52",
  "psutil==7.2.2",
  "pytest==8.4.2",
  "ptyprocess>=0.7.0,<1; sys_platform != 'win32'",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.13.0",
  "python-dotenv==1.2.2",
  "python-dateutil==2.9.0.post0",  # batch 4: date_math tool uses it directly (was transitive via croniter)
  "python-multipart>=0.0.9,<1",
  "pywin32>=306,<312; sys_platform == 'win32'",
  "pywinpty>=2.0.0,<3; sys_platform == 'win32'",
  "pyyaml==6.0.3",
  "requests==2.33.0",
  "rich==14.3.3",
  "ruamel.yaml==0.18.17",
  "slack-sdk==3.39.0",
  "snowballstemmer==3.1.1",
  "sqlalchemy[asyncio]==2.0.54",
  "tenacity==9.1.4",
  "tzdata==2025.3; sys_platform == 'win32'",
  "urllib3>=2.7.0,<3",
  "uvicorn[standard]==0.53.0",
  "websockets==15.0.1",
]

[project.optional-dependencies]
postgres = ["asyncpg==0.30.0"]
test = ["pytest==8.4.2", "pytest-asyncio==0.26.0", "radon==6.0.1", "detect-secrets==1.5.0", "ofxparse==0.21", "fitparse==1.2.0", "tree-sitter==0.25.2", "tree-sitter-python==0.25.0", "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2", "tree-sitter-go==0.25.0", "tree-sitter-rust==0.24.2", "tree-sitter-java==0.23.5", "tree-sitter-c==0.24.2", "tree-sitter-cpp==0.23.4", "tree-sitter-ruby==0.23.1", "tree-sitter-c-sharp==0.23.5", "tree-sitter-php==0.24.1", "tree-sitter-bash==0.25.1", "tree-sitter-json==0.24.8"]
stt = ["vosk==0.3.45"]
docling = ["docling==2.129.0"]
needle = ["cactus-needle==3.0.4"]
finance = ["ofxparse==0.21"]
fitness = ["fitparse==1.2.0"]  # batch 4 tranche 3: .FIT activity import (fit_import tool); MIT, (c) 2011-2020 David Cooper, (c) 2017-2020 Carey Metcalfe
# item 89: AST code intelligence (tree-sitter symbol/call index for targeted
# code retrieval). All 14 packages MIT, verified against on-disk LICENSE files
# Sep 24 2026; versions match the exact set the indexer was tested against
# (tree-sitter 0.25 runtime + grammar ABI range). Optional: the module degrades
# to per-language skips when a grammar is absent and to code_graph's stdlib-ast
# path when tree-sitter itself is absent.
codeintel = ["tree-sitter==0.25.2", "tree-sitter-python==0.25.0", "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2", "tree-sitter-go==0.25.0", "tree-sitter-rust==0.24.2", "tree-sitter-java==0.23.5", "tree-sitter-c==0.24.2", "tree-sitter-cpp==0.23.4", "tree-sitter-ruby==0.23.1", "tree-sitter-c-sharp==0.23.5", "tree-sitter-php==0.24.1", "tree-sitter-bash==0.25.1", "tree-sitter-json==0.24.8"]  # batch 4 tranche 3: .FIT activity import (fit_import tool); MIT, (c) 2011-2020 David Cooper, (c) 2017-2020 Carey Metcalfe  # batch 4 tranche 2: OFX statement import (ofx_import tool); MIT, (c) 2009 Jerry Seutter

[project.scripts]
noesek = "noesek.cli_surface:main"
noesek-tui = "noesek.tui:main"
noesek-agent = "noesek.upstream_boot:main_run_agent"
noesek-acp = "noesek.upstream_boot:main_acp"
noesek-computer = "noesek.computer.server:main"
noesek-webmcp = "noesek.core.webmcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/noesek", "vendor/hermes-agent/agent", "vendor/hermes-agent/tools", "vendor/hermes-agent/hermes_cli", "vendor/hermes-agent/gateway", "vendor/hermes-agent/tui_gateway", "vendor/hermes-agent/cron", "vendor/hermes-agent/acp_adapter", "vendor/hermes-agent/plugins", "vendor/hermes-agent/providers"]

