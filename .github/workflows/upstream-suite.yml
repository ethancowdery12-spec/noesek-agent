name: upstream-suite
# Runs the vendored upstream hermes-agent test suite (vendor/hermes-agent/tests,
# pinned commit d7b836ab) in tranches, in place, against the installed Noesek
# package. Informational: legs are continue-on-error so infra-needing failures
# never block a PR. Big suites are split into sub-legs to stay well inside
# runner resource limits. Per-tranche pytest output streams to
# tests/upstream/logs/*.log (uploaded as artifacts even when a leg dies).
# Results land in tests/upstream/TRANCHE_RESULTS.json per leg.
# See tests/upstream/EXCLUSIONS.md for the excluded dirs and why.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vendor/**'
      - 'scripts/run_upstream_tranches.py'
      - '.github/workflows/upstream-suite.yml'
      - 'tests/upstream/**'
jobs:
  tranche:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: cron,              spec: "tests/cron"}
          - {name: tools-core-am,     spec: "tests/tools/test_[a-m]*.py::not browser and not camofox"}
          - {name: tools-core-nz,     spec: "tests/tools/test_[n-z]*.py::not browser and not camofox"}
          - {name: tools-env,         spec: "tests/tools/environments"}
          - {name: tools-browser,     spec: "tests/tools::browser or camofox"}
          - {name: gateway-root-af,   spec: "tests/gateway/test_[a-f]*.py"}
          - {name: gateway-root-gm,   spec: "tests/gateway/test_[g-m]*.py"}
          - {name: gateway-root-nz,   spec: "tests/gateway/test_[n-z]*.py"}
          - {name: gateway-platforms, spec: "tests/gateway/platforms"}
          - {name: gateway-relay,     spec: "tests/gateway/relay"}
          - {name: agent-root-af,     spec: "tests/agent/test_[a-f]*.py"}
          - {name: agent-root-gm,     spec: "tests/agent/test_[g-m]*.py"}
          - {name: agent-root-nz,     spec: "tests/agent/test_[n-z]*.py"}
          - {name: agent-lsp,         spec: "tests/agent/lsp"}
          - {name: agent-transports,  spec: "tests/agent/transports"}
          - {name: plugins,           spec: "tests/plugins"}
          - {name: hermes_cli,        spec: "tests/hermes_cli"}
          - {name: tui_gateway,       spec: "tests/tui_gateway"}
          - {name: acp_adapter,       spec: "tests/acp_adapter"}
          - {name: skills,            spec: "tests/skills"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e '.[test]'
          pip install 'pytest==9.1.1' 'pytest-asyncio==1.3.0'
      - name: Install Playwright Chromium (browser leg only)
        if: matrix.name == 'tools-browser'
        run: python -m playwright install --with-deps chromium
      - name: Run tranche
        run: python scripts/run_upstream_tranches.py "${{ matrix.spec }}" 2>&1 | tee tranche-${{ matrix.name }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tranche-${{ matrix.name }}
          path: |
            tests/upstream/TRANCHE_RESULTS.json
            tests/upstream/logs/
            tranche-${{ matrix.name }}.log
          if-no-files-found: warn
